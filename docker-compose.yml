# Local stand-in for Supabase's Postgres (same engine). In production DATABASE_URL points at Supabase.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jenna
      POSTGRES_PASSWORD: jenna
      POSTGRES_DB: heyjenna
    ports: ["54329:5432"]
    volumes: [db:/var/lib/postgresql/data]
volumes:
  db:
